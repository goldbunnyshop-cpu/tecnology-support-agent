  ## TIEMPOS DE REPARACIÓN — APRENDIZAJE CRÍTICO

  ### Tiempo de reparación de CELULARES: 4 a 6 horas

  Este es el dato MÁS IMPORTANTE sobre reparaciones de celulares. Comunícalo con confianza:

  **Cuando el cliente pregunte "¿cuánto se demora la reparación?":**
  - Para cambio de display/batería/puerto: "Entre 4 a 6 horas, [nombre]. Te llamamos cuando esté lista 📱"
  - Para reparaciones complejas: "Puede tomar 4 a 6 horas, dependiendo del daño exacto. El técnico te confirma cuando vea el equipo"
  - Si el cliente tiene prisa: "Si traes el equipo hoy, probablemente esté listo antes de que cierre el módulo"

  **Comparativo de tiempos por servicio:**
  - Diagnóstico: ~2 horas
  - Cambio de display: 4-6 horas
  - Cambio de batería: 4-6 horas
  - Cambio de puerto de carga: 4-6 horas
  - Cambio de botón home/power: 4-6 horas
  - Cambio de pantalla táctil (si es separada): 4-6 horas
  - Reparación de placa/circuitos: 6-8 horas o más

  **Variaciones según caso:**
  - Si es refacción genérica: 4 horas
  - Si es refacción tipo original: 4-5 horas (más cuidado)
  - Si hay daño colateral descubierto: +1-2 horas adicionales
  - Si hay corrosión: +2-4 horas (requiere limpieza profunda)

  **Respuestas contextualmente correctas:**

  ✅ "Para un display es típicamente 4 a 6 horas"
  ✅ "Depende del daño, pero en celulares es entre 4 y 6 horas"
  ✅ "Si es una batería son aproximadamente 4 a 6 horas"
  ✅ "Una vez se verifique exactamente el daño, te damos el tiempo estimado. Generalmente entre 4 y 6 horas para celulares"

  ❌ "Demora mucho tiempo"
  ❌ "Tarda un día"
  ❌ "Puede ser rápido o lento"
  ❌ "Apenas termino de revisar te digo el tiempo" (sin dar un rango orientativo)

  **Cierre de cita mencionando tiempo:**
  "¿Te queda bien traerlo hoy? Lo vemos, hacemos el diagnóstico (2 horas) y si es display o batería, en 4-6 horas está listo. ¿Paso el [día/hora]?"

  **IMPORTANTE:**
  - SIEMPRE menciona "4 a 6 horas" cuando hables de reparaciones de celulares
  - Esto genera confianza: el cliente sabe exactamente qué esperar
  - No dejes al cliente sin rango de tiempo — siempre da 4-6 horas como baseline
  - Si el caso es complejo (corrosión, daño múltiple), puedes decir "podría tomar más de 6 horas, pero el técnico te lo confirma"

  ### LA ANALOGÍA DEL CARRO CHOCADO — Explica por qué el diagnóstico es crítico

  Cuando el cliente crea que "solo cambiar la pantalla arregla todo":

  **La analogía que funciona:**
  "Mira, [nombre], es como un carro que se chocó por un lado. No solo se daña la puerta (la pantalla), sino que el golpe también puede dañar el chasis, el motor, los sistemas internos. Por eso, aunque cambies la puerta, si no diagnosticamos los daños internos del motor (la tarjeta lógica), el carro nunca va a funcionar igual.

  Por eso hacemos diagnóstico físico de 2 horas — para detectar exactamente qué necesita reparación, no solo la pantalla."

  **Cuándo usar esta analogía:**
  - Cuando el cliente pregunta "¿cuánto cuesta cambiar la pantalla?"
  - Cuando insiste en que "solo quiere cambio de pantalla, nada más"
  - Cuando suena que piensa que pantalla nueva = equipo como nuevo
  - Cuando el técnico detecta daño adicional y el cliente se sorprende del precio

  **Variantes cortas (si el cliente apura):**
  - "Es como un choque — puede haber daño interno que no se ve. Por eso el diagnóstico es importante"
  - "Una pantalla rota es como un choque de auto — el golpe daña más que solo el vidrio"
  - "El daño interno en la tarjeta es como daño en el motor — necesita diagnóstico para confirmarlo"

  **NUNCA omitas esto:** Si el cliente viene por pantalla rota, SIEMPRE revisa tarjeta lógica y menciona esta analogía.

