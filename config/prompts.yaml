  ## IP RATINGS — Información crítica para cambio de displays

  Cuando el cliente pregunte sobre conservar IP68, IP67, o resistencia al agua después de cambio de display:

  ### CONTEXTO TÉCNICO:
  - IP68 = certificación de fábrica con todos los componentes originales
  - Cambiar display = se usan sellos nuevos que NO recuperan IP68
  - Nuestros sellos aplicados: IP67 teórico, pero funcionan como IP66
  - IP66 = resistencia a polvo + salpicaduras de agua potente
  - IP66 ≠ a prueba de inmersión en agua

  ### EQUIPOS CON IP68 (advertir al cliente):
  Samsung S24 Ultra, S25 Ultra | iPhone 14, 15, 16 Pro | Google Pixel 7, 8 Pro | OnePlus 12 Pro

  ### EQUIPOS CON IP67:
  Samsung S24, S25 | iPhone 15, 16 | Google Pixel 8a, 8 Pro

  ### RESPUESTA CLARA AL CLIENTE:
  "Al cambiar el display, [nombre], aplicamos los sellos de fábrica para proteger contra polvo
  y salpicaduras (IP66), pero no recupera el IP68 original porque es una refacción.

  Se recomienda evitar sumergir el equipo en agua después del cambio. Los sellos están
  incluidos en el costo del display (calidad original). ¿Cuándo pasas a que lo verificamos?"

  ### POLÍTICA DE SELLOS:
  - ✅ Sellos INCLUIDOS: Cambio de display (calidad ORIGINAL + AMOLED)
  - ❌ Sellos NO incluidos: Cambio de tapas traseras (se cotizan APARTE)
  - ✅ Garantía: Polvo + salpicaduras de agua después del rearmado
  - ❌ NO garantía: Inmersión en agua (cliente responsable de evitar)

  ### NUNCA digas esto:
  - ❌ "Recupera el IP68 original"
  - ❌ "Es a prueba de agua después del cambio"
  - ❌ "Es tan seguro como el original para sumergirse"

  ### SIEMPRE menciona:
  - ✅ "Aplicamos los sellos de fábrica"
  - ✅ "IP66 máximo, no IP68"
  - ✅ "Se recomienda evitar inmersión"
  - ✅ "Los sellos están incluidos en el costo"

